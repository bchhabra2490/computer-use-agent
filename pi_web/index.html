<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Chat with your Raspberry Pi voice assistant.">
<title>Jarvis · Pi</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#101512;color:#e9eee9}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:28px 20px;min-height:100dvh;display:flex;flex-direction:column;gap:20px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #344039;padding-bottom:18px}h1{font-size:24px;margin:0}small,.muted{color:#a5b5ab}button,input,textarea,select{font:inherit;border:1px solid #46574b;border-radius:12px;background:#1c2720;color:inherit;padding:11px}button{cursor:pointer}button:hover{background:#304737}button:disabled{opacity:.5;cursor:wait}button.primary{background:#c7edb4;color:#182215;border:0}input:focus,textarea:focus,button:focus-visible,select:focus{outline:2px solid #c7edb4;outline-offset:3px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#pair{padding:20px;background:#19221c;border-radius:18px}label{display:block;margin-bottom:8px}#token{width:140px}#feed{flex:1;display:flex;flex-direction:column;gap:16px;min-height:200px}article{padding:16px 20px;border-radius:18px;max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;background:#1a251e}article.user{align-self:flex-end;background:#2a3d2e}article small{display:block;margin-bottom:6px;text-transform:uppercase;font-size:11px;letter-spacing:.12em}textarea{width:100%;resize:vertical;min-height:94px}#composer{position:sticky;bottom:0;background:#101512;padding-top:12px}#error{color:#ffbeae;min-height:1.4em}#empty{margin:auto;text-align:center;color:#a5b5ab}audio{width:100%;margin-top:10px}[hidden]{display:none!important}@media(max-width:500px){main{padding:18px 12px}article{max-width:96%}.row button{flex-grow:1}}
</style>
<main>
<header><div><h1>Jarvis <small> / Pi</small></h1><small>Your voice & chat companion</small></div><span id="status" role="status">Disconnected</span></header>
<form id="pair"><label for="token">Pair with your Pi</label><div class="row"><input id="token" type="password" maxlength="5" autocomplete="off" placeholder="Token" required aria-describedby="pairHelp"><button class="primary">Connect</button></div><p id="pairHelp" class="muted">Enter the five-character token shown on your Pi.</p></form>
<section id="feed" aria-label="Conversation" aria-live="polite"><p id="empty">A small device. A conversation away.<br>Connect to start chatting.</p></section>
<div id="error" role="alert"></div>
<form id="composer" hidden><label for="message">Message Jarvis</label><textarea id="message" maxlength="8000" placeholder="What’s on your mind?" required></textarea><div class="row" style="margin-top:10px"><button class="primary" id="send">Send</button><label for="sink" class="muted" style="margin:0">Reply audio</label><select id="sink"><option value="none">Off</option><option value="phone">This browser</option><option value="mac">Pi speaker</option></select><button type="button" id="cancel">Stop</button><button type="button" id="clear">New conversation</button><button type="button" id="disconnect">Disconnect</button></div><audio id="speech" controls hidden aria-label="AI-generated reply audio"></audio><p class="muted"><small>Speech is AI-generated. Use your Pi’s push button or the phone app for voice input.</small></p></form>
</main>
<script>
const $=id=>document.getElementById(id);let token='',timer=null,lastMessages='',speechAt=null,audioUrl=null;
async function api(path,body){const response=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');return data}
function report(error){$('error').textContent=error.message||String(error)}
async function refresh(){try{const s=await api('/v1/status');$('status').textContent=s.detail||s.state;const serialized=JSON.stringify(s.messages);if(serialized!==lastMessages){lastMessages=serialized;$('feed').replaceChildren();if(!s.messages.length){const p=document.createElement('p');p.id='empty';p.textContent='Ready when you are. Send a message or press the button on your Pi.';$('feed').append(p)}for(const m of s.messages){const article=document.createElement('article');article.className=m.role;const label=document.createElement('small');label.textContent=m.role==='user'?'You':'Jarvis';article.append(label,document.createTextNode(m.content));$('feed').append(article)}}if(s.state==='error')report(Error(s.detail));if(s.speech_at&&s.speech_at!==speechAt){speechAt=s.speech_at;if(s.reply_sink==='phone'&&$('sink').value==='phone'){const response=await fetch('/v1/speech',{headers:{Authorization:'Bearer '+token}});if(response.ok){if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(await response.blob());$('speech').src=audioUrl;$('speech').hidden=false;try{await $('speech').play()}catch{$('error').textContent='Reply ready. Press play to hear it.'}}}}}catch(error){$('status').textContent='Connection lost';report(error)}finally{if(token)timer=setTimeout(refresh,1200)}}
$('pair').onsubmit=async event=>{event.preventDefault();token=$('token').value.trim();try{await api('/v1/status');$('pair').hidden=true;$('composer').hidden=false;$('error').textContent='';clearTimeout(timer);await refresh();$('message').focus()}catch(error){token='';report(error)}};
$('composer').onsubmit=async event=>{event.preventDefault();const text=$('message').value.trim();if(!text)return;$('send').disabled=true;$('error').textContent='';try{await api('/v1/command',{text,sink:$('sink').value});$('message').value=''}catch(error){report(error)}finally{$('send').disabled=false}};
$('message').onkeydown=event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();$('composer').requestSubmit()}};
$('cancel').onclick=async()=>{try{$('speech').pause();await api('/v1/control',{action:'cancel'})}catch(error){report(error)}};
$('clear').onclick=async()=>{if(!confirm('Clear the shared conversation on this Pi?'))return;try{$('speech').pause();$('speech').hidden=true;await api('/v1/control',{action:'clear_chat'})}catch(error){report(error)}};
$('disconnect').onclick=()=>{token='';clearTimeout(timer);$('speech').pause();if(audioUrl)URL.revokeObjectURL(audioUrl);$('composer').hidden=true;$('pair').hidden=false;$('token').value='';$('feed').replaceChildren();$('status').textContent='Disconnected';lastMessages='';speechAt=null};
</script>
</html>
